# frontend/nginx.conf — VULNERABLE BY DESIGN (definisi pristine, jangan diedit untuk fixing)
#
# Kerentanan: header `Connection` kiriman klien diteruskan apa adanya ke hop
# berikutnya ($http_connection). Ini memungkinkan penyerang mendaftarkan header
# arbitrer (mis. X-Forwarded-For) sebagai hop-by-hop, sehingga hop berikutnya
# menghapus header tersebut sebelum sampai ke backend.
#
# Perilaku yang benar (RFC 9110 §7.6.1): proxy harus MENGONSUMSI header Connection
# — menghapus header yang terdaftar dan TIDAK meneruskan daftarnya ke hop berikut.

events {}

http {
    access_log off;

    # Teruskan daftar hop-by-hop kiriman klien apa adanya (RENTAN);
    # kalau klien tidak mengirim Connection, kirim "close" seperti biasa.
    map $http_connection $fwd_connection {
        default $http_connection;
        ""      close;
    }

    upstream mid {
        server mid:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mid;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # XFF diisi IP klien eksternal TETAP (203.0.113.7 = TEST-NET-3, "internet").
            # Di deployment nyata ini $remote_addr, tapi NAT published-port Docker
            # membuat $remote_addr tidak deterministik: dia bisa berupa IP gateway
            # bridge yang masuk rentang TRUSTED_CIDR, sehingga baseline /admin
            # lolos (200) tanpa serangan di sebagian mesin. IP tetap ini menjamin
            # baseline selalu 403 di semua mesin; kerentanan lab ini ada di
            # penerusan header Connection di bawah, bukan di sini.
            proxy_set_header X-Forwarded-For 203.0.113.7;
            # >>> BARIS RENTAN: meneruskan daftar hop-by-hop kiriman klien <<<
            proxy_set_header Connection $fwd_connection;
        }
    }
}
