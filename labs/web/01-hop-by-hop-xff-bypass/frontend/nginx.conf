# frontend/nginx.conf — edge proxy lab: menerima HTTP dari klien,
# meneruskannya ke mid.

events {}

http {
    access_log off;

    map $http_connection $fwd_connection {
        default $http_connection;
        ""      close;
    }

    upstream mid {
        server mid:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mid;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For 203.0.113.7;
            proxy_set_header Connection $fwd_connection;
        }
    }
}
