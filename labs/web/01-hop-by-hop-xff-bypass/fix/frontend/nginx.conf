# fix/frontend/nginx.conf — SCAFFOLD FASE 2
#
# Salinan dari ../frontend/nginx.conf (definisi pristine — jangan edit file
# aslinya; hasil kerjamu hanya di file ini).
#
# Materi fase 2 ada di ../../README.md (bagian Fase 2).
#
# TODO (fase 2): perbaiki config ini. Tandai perubahanmu dengan komentar "FIX:".
#
# Kriteria (dicek verifier):
#   - serangan fase 1 -> 403 di /admin
#   - request normal -> 403 di /admin
#   - GET / dan GET /debug/headers -> 200, rantai X-Forwarded-For normal utuh

events {}

http {
    access_log off;

    # TODO (fase 2)
    map $http_connection $fwd_connection {
        default $http_connection;
        ""      close;
    }

    upstream mid {
        server mid:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mid;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For 203.0.113.7;
            # TODO (fase 2)
            proxy_set_header Connection $fwd_connection;
        }
    }
}
