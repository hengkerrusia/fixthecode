# fix/frontend/nginx.conf — SCAFFOLD FASE 2
#
# Ini salinan dari ../frontend/nginx.conf (versi RENTAN).
# TODO (fase 2): perbaiki config ini supaya daftar hop-by-hop kiriman klien
# TIDAK diteruskan ke hop berikutnya. Tandai perubahanmu dengan komentar "FIX:".
#
# Kriteria fix yang benar:
#   - serangan fase 1 (Connection: ..., X-Forwarded-For) -> 403 di /admin
#   - request normal tetap 403 di /admin (pihak luar tetap ditolak)
#   - GET / dan GET /debug/headers tetap 200, rantai XFF normal tetap utuh

events {}

http {
    access_log off;

    # TODO (fase 2): blok map ini bagian dari mekanisme rentan.
    # Apakah daftar kiriman klien boleh diteruskan apa adanya?
    map $http_connection $fwd_connection {
        default $http_connection;
        ""      close;
    }

    upstream mid {
        server mid:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mid;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # (Salinan perilaku pristine: XFF = IP klien eksternal tetap 203.0.113.7.
            # Lihat komentar di ../frontend/nginx.conf soal kenapa bukan $remote_addr.)
            proxy_set_header X-Forwarded-For 203.0.113.7;
            # TODO (fase 2): BARIS RENTAN — perbaiki baris ini.
            proxy_set_header Connection $fwd_connection;
        }
    }
}
