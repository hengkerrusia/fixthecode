# Lab 12: nginx sebagai cache layer (ala CDN).
# - Respons yang path-nya berakhiran .css di-cache (aturan berbasis ekstensi).
# - Cache key TIDAK mencakup header auth (X-Auth-Token): respons terautentikasi
#   bisa disajikan ke request tanpa auth = inti web cache deception.
# - Keputusan cache mengikuti header Cache-Control upstream (tidak ada
#   proxy_cache_valid): hanya respons "public" yang disimpan.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=lab12:10m
                     max_size=50m inactive=10m use_temp_path=off;

    server {
        listen 80;

        location ~ \.css$ {
            proxy_pass http://app:8000;
            proxy_cache lab12;
            proxy_cache_key $scheme$proxy_host$request_uri;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://app:8000;
            add_header X-Cache-Status "BYPASS" always;
        }
    }
}
